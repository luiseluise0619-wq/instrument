name: Build & Validate

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: List artefacts
        shell: bash
        run: find build/VocalChopStudio_artefacts -maxdepth 3 -print

      # ---- pluginval (industry-standard plugin validator) -------------------
      - name: Run pluginval
        continue-on-error: true
        shell: bash
        run: |
          curl -L -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_${{ runner.os }}.zip"
          unzip -q pluginval.zip
          if [ "${{ runner.os }}" = "macOS" ]; then
            PLUGINVAL="./pluginval.app/Contents/MacOS/pluginval"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            PLUGINVAL="./pluginval.exe"
          else
            PLUGINVAL="./pluginval"
          fi
          VST3=$(find build/VocalChopStudio_artefacts -name "*.vst3" -maxdepth 4 | head -1)
          echo "Validating: $VST3"
          "$PLUGINVAL" --strictness-level 5 --validate "$VST3"

      # ---- Upload the built plugins as downloadable artifacts ---------------
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalChopStudio-${{ matrix.name }}-VST3
          path: build/VocalChopStudio_artefacts/**/VST3/
          if-no-files-found: error

      - name: Upload AU (macOS only)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: VocalChopStudio-macOS-AU
          path: build/VocalChopStudio_artefacts/**/AU/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VocalChopStudio-${{ matrix.name }}-Standalone
          path: build/VocalChopStudio_artefacts/**/Standalone/
