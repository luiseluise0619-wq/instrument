# Provided build recipe. This workflow was NOT executed in the delivery environment.
name: SLYCE build and core tests
on: [push, pull_request, workflow_dispatch]
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-tests -DSLYCE_TESTS_ONLY=ON -DSLYCE_BUILD_ENGINE_TESTS=ON -DSLYCE_TEST_LOCAL_SHIM=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --parallel 2
      - run: ctest --test-dir build-tests --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/check_source.py
  plugin-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: SLYCE-${{ matrix.os }}
          path: build/VocalChopStudio_artefacts
