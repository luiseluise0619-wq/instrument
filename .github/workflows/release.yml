name: Release

# Three ways to publish a release:
#   1. Push a tag `v*` (normal flow).
#   2. Run the workflow manually from the Actions tab (tag input).
#   3. Push a change to the `.release-tag` file — the workflow creates the
#      tag named in that file (for environments that can't push tags).
on:
  push:
    tags: ["v*"]
    branches: ["claude/vocalchop-studio-juce-vst3-ii0tcx", "main"]
    paths: [".release-tag"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0) — created if it doesn't exist"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(tr -d '[:space:]' < .release-tag)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as ${TAG}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          ART="build/VocalChopStudio_artefacts/Release"
          mkdir -p dist
          cp -r "$ART"/VST3/*.vst3 dist/   # product renamed to Slyce.vst3; glob survives future renames
          if [ -d "$ART/Standalone" ]; then cp -r "$ART/Standalone/." dist/; fi
          if [ -d "$ART/AU" ]; then cp -r "$ART/AU/." dist/; fi
          # GPL-3.0 requires the full licence text alongside binaries.
          curl -sL https://www.gnu.org/licenses/gpl-3.0.txt -o dist/COPYING \
            || echo "See https://www.gnu.org/licenses/gpl-3.0.txt" > dist/COPYING
          cp README.md LICENSE.md dist/
          # Ship only the installer for THIS os. Three scripts in one folder
          # is three chances to run the wrong one.
          case "${RUNNER_OS}" in
            Windows) cp packaging/install-windows.bat dist/"Install Slyce.bat" ;;
            macOS)   cp packaging/install-macos.command dist/"Install Slyce.command"
                     cp packaging/slyce-install-common.sh dist/
                     chmod +x dist/"Install Slyce.command" ;;
            Linux)   cp packaging/install-linux.sh dist/install-slyce.sh
                     cp packaging/slyce-install-common.sh dist/
                     chmod +x dist/install-slyce.sh ;;
          esac
          cat > dist/INSTALL.txt <<'EOF'
          SLYCE - HOW TO INSTALL
          ======================

          EASIEST WAY - run the installer in this folder.
          It installs the new version first, checks it, and only then moves
          your previous version into a backup folder - so upgrading never
          leaves two copies of Slyce in your plugin list, and a failed
          install can never leave you with none. It identifies our own files
          by their contents, not by their name, so a plugin from another
          vendor is never touched.

            Windows   double-click "Install Slyce.bat"  (it will ask for
                      administrator access - that is only to write into
                      Program Files)
            macOS     double-click "Install Slyce.command".  If macOS
                      refuses: right-click it > Open > Open.
            Linux     ./install-slyce.sh

          Close your DAW before running it, then rescan plugins after.

          If you would rather copy the files by hand, read on.

          ---------------------------------------------------------------

          UPGRADING FROM AN OLDER VERSION
            Delete the old bundle before copying the new one. On Windows,
            dragging a folder onto an existing folder MERGES them, which
            leaves files from the old build inside the new plugin.
            Versions before 3.0 were called "VocalChop Studio" - if you
            have that one, delete it too or the DAW will list both.

          WINDOWS (FL Studio, Ableton, etc.)
            1. Copy the ENTIRE "Slyce.vst3" folder to:
                 C:\Program Files\Common Files\VST3
            2. FL Studio: Options > Manage plugins > "Find more plugins".
               Slyce appears under Installed > Generators (it is an
               instrument, so add it to the Channel Rack, not the mixer).

          NOTE: there is no .dll - that is the old VST2 format, which was
          discontinued by Steinberg. VST3 is the current standard and every
          modern DAW (FL 20.7+, Ableton 10.1+, Studio One...) loads it.

          MACOS
            Copy "Slyce.vst3" to /Library/Audio/Plug-Ins/VST3
            (and "Slyce.component" to /Library/Audio/Plug-Ins/Components
            for Logic/GarageBand). If macOS blocks the first launch:
            System Settings > Privacy & Security > Open Anyway.

          LINUX
            Copy "Slyce.vst3" to ~/.vst3

          STANDALONE
            The Slyce app runs on its own without any DAW - just open it.
          EOF
          cd dist
          cmake -E tar cf "../Slyce-${RELEASE_TAG}-${RUNNER_OS}.zip" --format=zip -- .

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Slyce-*.zip
          # Only one matrix job generates notes, or the body gets duplicated.
          generate_release_notes: ${{ matrix.name == 'Linux' }}
