name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0) — created if it doesn't exist"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          ART="build/VocalChopStudio_artefacts/Release"
          mkdir -p dist
          cp -r "$ART/VST3/VocalChop Studio.vst3" dist/
          if [ -d "$ART/Standalone" ]; then cp -r "$ART/Standalone/." dist/; fi
          if [ -d "$ART/AU" ]; then cp -r "$ART/AU/." dist/; fi
          # GPL-3.0 requires the full licence text alongside binaries.
          curl -sL https://www.gnu.org/licenses/gpl-3.0.txt -o dist/COPYING \
            || echo "See https://www.gnu.org/licenses/gpl-3.0.txt" > dist/COPYING
          cp README.md LICENSE.md dist/
          cd dist
          cmake -E tar cf "../VocalChopStudio-${RELEASE_TAG}-${RUNNER_OS}.zip" --format=zip -- .

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: VocalChopStudio-*.zip
          generate_release_notes: true
